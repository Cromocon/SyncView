name: CI

# main è l'app Python: la CI C gira su ogni altro branch (SyncView-C e i branch di lavoro) e su ogni pull request.
on:
  push:
    branches-ignore: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      # gst-plugin-gtk4 fornisce gtk4paintablesink (Ubuntu 24.04 non lo pacchettizza); xvfb il display per i test con finestra.
      # Senza uno dei due i test GTK escono con 77 (skip): lo script check_skips.py lo trasforma in errore.
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git meson ninja python gtk4 gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugins-ugly gst-libav gst-plugin-gtk4 sqlite json-glib libsoup3 xorg-server-xvfb mesa ffmpeg
          useradd -m builder
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder "$GITHUB_WORKSPACE"
      - name: meson setup
        run: runuser -u builder -- env HOME=/home/builder meson setup build -Dwerror=true
      - name: meson compile
        run: runuser -u builder -- env HOME=/home/builder meson compile -C build
      - name: meson test
        run: runuser -u builder -- env HOME=/home/builder xvfb-run -a meson test -C build --print-errorlogs
      - name: Test saltati non previsti
        run: python3 .github/scripts/check_skips.py build/meson-logs/testlog.json linux
      - name: Log di Meson
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-linux
          path: build/meson-logs

  build-linux-sanitizers:
    name: Linux (ASan + UBSan, Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      # gst-plugin-gtk4 fornisce gtk4paintablesink (Ubuntu 24.04 non lo pacchettizza); xvfb il display per i test con finestra.
      # Senza uno dei due i test GTK escono con 77 (skip): lo script check_skips.py lo trasforma in errore.
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git meson ninja python gtk4 gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugins-ugly gst-libav gst-plugin-gtk4 sqlite json-glib libsoup3 xorg-server-xvfb mesa ffmpeg
          useradd -m builder
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder "$GITHUB_WORKSPACE"
      - name: meson setup
        run: runuser -u builder -- env HOME=/home/builder meson setup build -Db_sanitize=address,undefined -Db_lundef=false --buildtype=debug
      - name: meson compile
        run: runuser -u builder -- env HOME=/home/builder meson compile -C build
      - name: meson test
        # LSAN_OPTIONS con tests/lsan.supp (driver GPU/Mesa/font di terze parti) è già impostato per ogni test in tests/meson.build.
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: runuser -u builder -- env HOME=/home/builder xvfb-run -a meson test -C build --print-errorlogs
      - name: Test saltati non previsti
        run: python3 .github/scripts/check_skips.py build/meson-logs/testlog.json linux
      - name: Log di Meson
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-linux-sanitizers
          path: build/meson-logs

  build-macos:
    name: macOS (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install meson ninja gtk4 gstreamer gst-plugins-base \
            gst-plugins-good gst-plugins-bad gst-libav sqlite json-glib libsoup
      - name: meson setup
        run: meson setup build
      - name: meson compile
        run: meson compile -C build
      - name: meson test
        run: meson test -C build --print-errorlogs
      - name: Test saltati non previsti
        run: python3 .github/scripts/check_skips.py build/meson-logs/testlog.json macos
      - name: Log di Meson
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-macos
          path: build/meson-logs

  build-windows:
    name: Windows (windows-latest, MSYS2/MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-gst-plugins-rs
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-libsoup3
      - name: meson setup
        run: meson setup build
      - name: meson compile
        run: meson compile -C build
      - name: meson test
        run: meson test -C build --print-errorlogs
      - name: Test saltati non previsti
        run: python3 .github/scripts/check_skips.py build/meson-logs/testlog.json windows
      - name: Log di Meson
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-windows
          path: build/meson-logs
