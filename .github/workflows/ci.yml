name: CI

on:
  push:
    branches: [SyncView-C]
  pull_request:
    branches: [SyncView-C]

jobs:
  build-linux:
    name: Linux (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build \
            libgtk-4-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            libsqlite3-dev libjson-glib-dev libglib2.0-dev
      - name: meson setup
        run: meson setup build
      - name: meson compile
        run: meson compile -C build
      - name: meson test
        run: meson test -C build

  build-macos:
    name: macOS (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install meson ninja gtk4 gstreamer gst-plugins-base \
            gst-plugins-good gst-plugins-bad gst-libav sqlite json-glib
      - name: meson setup
        run: meson setup build
      - name: meson compile
        run: meson compile -C build
      - name: meson test
        run: meson test -C build

  build-windows:
    name: Windows (windows-latest, MSYS2/MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-json-glib
      - name: meson setup
        run: meson setup build
      - name: meson compile
        run: meson compile -C build
      - name: meson test
        run: meson test -C build
